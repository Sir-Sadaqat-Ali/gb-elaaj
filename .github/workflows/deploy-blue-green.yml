# ─────────────────────────────────────────────────────────────
# Gb Elaaj — Blue-green deploy to Vercel
#
# Vercel maps onto blue-green naturally:
#   • Every deploy is immutable + has its own URL → that's "green"
#   • The production alias (gb-elaaj.vercel.app) is the live "blue"
#   • Promotion is `vercel alias set <green-url> gb-elaaj.vercel.app` — atomic
#   • Rollback is just keeping blue (don't flip the alias) or re-aliasing back
#
# Required GitHub secrets:
#   VERCEL_TOKEN         — https://vercel.com/account/tokens
#   VERCEL_ORG_ID        — from .vercel/project.json
#   VERCEL_PROJECT_ID    — from .vercel/project.json
# ─────────────────────────────────────────────────────────────

name: Blue-green deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote green to production after smoke tests"
        required: true
        type: boolean
        default: true

env:
  PROD_ALIAS: gb-elaaj.vercel.app
  HEALTH_PATH: /api/health
  WORKING_DIR: web

jobs:
  build-green:
    name: Build green (preview deploy)
    runs-on: ubuntu-latest
    outputs:
      green_url: ${{ steps.deploy.outputs.green_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ env.WORKING_DIR }}/pnpm-lock.yaml

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project config
        working-directory: ${{ env.WORKING_DIR }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build green
        # Migrations run inside the build via scripts/migrate-if-prod.mjs,
        # gated on VERCEL_ENV=production. Preview deploys skip migrations.
        working-directory: ${{ env.WORKING_DIR }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy green (no alias flip yet)
        id: deploy
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          GREEN_URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel-deploy.log | grep -oE 'https://[^ ]+\.vercel\.app' | tail -1)
          if [ -z "$GREEN_URL" ]; then
            echo "::error::Failed to capture green URL"
            cat /tmp/vercel-deploy.log
            exit 1
          fi
          echo "green_url=$GREEN_URL" >> $GITHUB_OUTPUT
          echo "::notice::Green deployed at $GREEN_URL"

  health-check:
    name: Health check + smoke tests on green
    needs: build-green
    runs-on: ubuntu-latest
    steps:
      - name: Wait for green to be reachable
        run: |
          GREEN="${{ needs.build-green.outputs.green_url }}"
          for i in {1..30}; do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "$GREEN${{ env.HEALTH_PATH }}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "::notice::Health check passed on attempt $i"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "::error::Health check failed after 30 attempts"
          cat /tmp/health.json 2>/dev/null
          exit 1

      - name: Smoke test — homepage renders
        run: |
          GREEN="${{ needs.build-green.outputs.green_url }}"
          BODY=$(curl -sf "$GREEN/")
          echo "$BODY" | grep -q "Gb Elaaj" || (echo "::error::Homepage missing brand" && exit 1)
          echo "::notice::Homepage smoke test passed"

      - name: Smoke test — login page renders
        run: |
          GREEN="${{ needs.build-green.outputs.green_url }}"
          BODY=$(curl -sf "$GREEN/login")
          echo "$BODY" | grep -q "Welcome back" || (echo "::error::Login page missing copy" && exit 1)
          echo "::notice::Login smoke test passed"

      - name: Smoke test — protected route bounces unauthenticated
        run: |
          GREEN="${{ needs.build-green.outputs.green_url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$GREEN/admin/dashboard")
          if [ "$STATUS" != "307" ] && [ "$STATUS" != "302" ]; then
            echo "::error::/admin/dashboard expected 30x, got $STATUS"
            exit 1
          fi
          echo "::notice::RBAC smoke test passed (got $STATUS)"

      - name: Smoke test — auth redirects are no-store
        run: |
          GREEN="${{ needs.build-green.outputs.green_url }}"
          CC=$(curl -sI "$GREEN/admin/dashboard" | grep -i "^cache-control:" | tr -d '\r\n')
          echo "$CC"
          echo "$CC" | grep -qi "no-store" || (echo "::error::Auth redirect not no-store — cache-loop risk" && exit 1)
          echo "::notice::Cache-control smoke test passed"

  promote:
    name: Promote green → production alias (flip blue → green)
    needs: [build-green, health-check]
    runs-on: ubuntu-latest
    if: success() && (github.event_name == 'push' || github.event.inputs.promote == 'true')
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Atomically alias production to green
        run: |
          vercel alias set "${{ needs.build-green.outputs.green_url }}" "${{ env.PROD_ALIAS }}" --token=${{ secrets.VERCEL_TOKEN }}
          echo "::notice::Production alias now points to green"

      - name: Verify production serves green
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.PROD_ALIAS }}${{ env.HEALTH_PATH }}")
            if [ "$STATUS" = "200" ]; then
              echo "::notice::Production health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Production health check failed after promotion"
          exit 1

  rollback-on-failure:
    name: Rollback (no-op since blue alias never moved)
    needs: [build-green, health-check]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Notify
        run: |
          echo "::warning::Green failed health/smoke. Blue (current production alias) was never moved — no rollback needed."
          echo "Failed green URL: ${{ needs.build-green.outputs.green_url }}"
          echo "Inspect logs and re-run after fix."
